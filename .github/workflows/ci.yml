name: Verify game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - run: bun run test:firebase
      - run: bun run build
  browser:
    name: browser (${{ matrix.story }})
    needs: game
    strategy:
      fail-fast: false
      matrix:
        include:
          - {story: game, grep: 'four independent|a phone|a downloaded|companion levels on the web|tower input on the web'}
          - {story: tabletop, grep: 'four people share|tabletop lab handoff|tabletop companions|tabletop tower'}
          - {story: motion, grep: 'native 3D plaques|every motion|closed sum'}
          - {story: layout, grep: 'phone canvas|approved pieces|portrait crops|desktop table'}
          - {story: gallery, grep: 'all gallery|final runner'}
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e --grep "$STORY"
        env:
          STORY: ${{ matrix.grep }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-${{ matrix.story }}
          path: |
            artifacts/
            test-results/
      - uses: actions/upload-artifact@v4
        if: success() && matrix.story == 'tabletop'
        with:
          name: tabletop-native-captures
          retention-days: 7
          path: artifacts/tabletop*.png
