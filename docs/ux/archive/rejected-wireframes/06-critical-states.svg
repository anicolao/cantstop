<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img"><title>Critical states — one-runner ambiguity, bust, unbanked summit and connection recovery</title><defs><radialGradient id="sky"><stop stop-color="#284751"/><stop offset="1" stop-color="#101e29"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#sky)"/><path d="M0 588.0L216.0 215.6L403.20000000000005 421.4L705.6 60L1007.9999999999999 392.0L1224.0 196.0L1440 588.0V980H0Z" fill="#34525b" opacity=".16"/><text x="40" y="52" fill="#e9bd72" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">THE MOMENTS THAT MUST BE CLEAR</text><rect x="36" y="85" width="660" height="402" rx="22" fill="#192d39" stroke="#42606a"/><rect x="724" y="85" width="660" height="402" rx="22" fill="#192d39" stroke="#42606a"/><rect x="36" y="515" width="660" height="402" rx="22" fill="#192d39" stroke="#42606a"/><rect x="724" y="515" width="660" height="402" rx="22" fill="#192d39" stroke="#42606a"/><text x="66" y="128" fill="#76d6cb" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">A · Choose where the last runner goes</text><text x="66" y="182" fill="#f4eddc" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">One runner left · Two new columns</text><text x="66" y="229" fill="#f4eddc" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">6 + 8 → use the last runner on 6 OR 8.</text><rect x="66" y="263" width="280" height="52" rx="12" fill="#76d6cb" stroke="#76d6cb"/><text x="206.0" y="295.0" fill="#101e29" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Use runner on 6</text><rect x="366" y="263" width="280" height="52" rx="12" fill="#192d39" stroke="#42606a"/><text x="506.0" y="295.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Use runner on 8</text><text x="66" y="358" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">The unchosen column cannot move.</text><text x="66" y="400" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Choose a destination, then confirm the move.</text><text x="754" y="128" fill="#f69b80" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">B · No legal move</text><text x="754" y="187" fill="#f4eddc" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Bust. Those 6 steps are lost.</text><text x="754" y="237" fill="#f4eddc" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Your saved positions and column 10 remain.</text><text x="754" y="283" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">No pairing can move a runner on 6, 7 or 8.</text><text x="754" y="355" fill="#76d6cb" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Bea’s turn · Roll dice</text><text x="754" y="405" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">The explanation remains in Turn history.</text><text x="66" y="558" fill="#e9bd72" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">C · A summit is still at risk</text><text x="66" y="615" fill="#f4eddc" font-family="Arial, sans-serif" font-size="33" font-weight="700" text-anchor="start">6 reached the top.</text><text x="66" y="663" fill="#f4eddc" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Stop to claim column 6.</text><text x="66" y="702" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Rolling again risks this summit too.</text><rect x="66" y="755" width="330" height="62" rx="12" fill="#76d6cb" stroke="#76d6cb"/><text x="231.0" y="792.0" fill="#101e29" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Stop &amp; claim 6</text><rect x="412" y="755" width="240" height="62" rx="12" fill="#192d39" stroke="#42606a"/><text x="532.0" y="792.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Roll again</text><text x="66" y="868" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A runner at the summit stays in use until turn end.</text><text x="754" y="558" fill="#76d6cb" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">D · Return to the same decision</text><text x="754" y="615" fill="#f4eddc" font-family="Arial, sans-serif" font-size="33" font-weight="700" text-anchor="start">Rejoining your table…</text><text x="754" y="665" fill="#f4eddc" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Your last roll is still being checked.</text><text x="754" y="705" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">You can inspect the board while you wait.</text><rect x="754" y="756" width="260" height="52" rx="12" fill="#192d39" stroke="#42606a"/><text x="884.0" y="788.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Retry connection</text><text x="754" y="863" fill="#76d6cb" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">On return: Ari’s turn · Choose a pairing</text></svg>