<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img"><title>Journey storyboard — home, gathering, guided learning and end-of-game review</title><defs><radialGradient id="sky"><stop stop-color="#284751"/><stop offset="1" stop-color="#101e29"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#sky)"/><path d="M0 588.0L216.0 215.6L403.20000000000005 421.4L705.6 60L1007.9999999999999 392.0L1224.0 196.0L1440 588.0V980H0Z" fill="#34525b" opacity=".16"/><text x="40" y="52" fill="#e9bd72" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">ARRIVE → GATHER → LEARN → PLAY AGAIN</text><rect x="36" y="85" width="660" height="402" rx="22" fill="#192d39" stroke="#42606a"/><rect x="724" y="85" width="680" height="402" rx="22" fill="#192d39" stroke="#42606a"/><rect x="36" y="515" width="660" height="425" rx="22" fill="#192d39" stroke="#42606a"/><rect x="724" y="515" width="680" height="425" rx="22" fill="#192d39" stroke="#42606a"/><text x="66" y="126" fill="#76d6cb" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">01 · Base camp</text><text x="66" y="181" fill="#e9bd72" font-family="Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start">CAN’T STOP</text><text x="66" y="222" fill="#f4eddc" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">One more roll?</text><rect x="66" y="253" width="285" height="52" rx="12" fill="#76d6cb" stroke="#76d6cb"/><text x="208.5" y="285.0" fill="#101e29" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Play with friends</text><rect x="66" y="317" width="285" height="52" rx="12" fill="#192d39" stroke="#42606a"/><text x="208.5" y="349.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Play on one device</text><rect x="367" y="253" width="285" height="52" rx="12" fill="#192d39" stroke="#42606a"/><text x="509.5" y="285.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Learn by playing</text><rect x="367" y="317" width="285" height="52" rx="12" fill="#192d39" stroke="#42606a"/><text x="509.5" y="349.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Join a table</text><text x="66" y="434" fill="#76d6cb" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Continue Ari’s table  ↗</text><text x="754" y="126" fill="#76d6cb" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">02 · Gather friends</text><text x="754" y="171" fill="#f4eddc" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Your table · 3 of 4 ready</text><text x="754" y="215" fill="#f4eddc" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Ari ● Ready    Bea ■ Ready    Cal ▲ Ready</text><text x="754" y="249" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Dev ◆ Choosing a name…</text><text x="754" y="295" fill="#76d6cb" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Invite link     Copy     Share</text><text x="754" y="331" fill="#f4eddc" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Or join with code:  CLIMB7</text><rect x="754" y="367" width="295" height="52" rx="12" fill="#192d39" stroke="#42606a"/><text x="901.5" y="399.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Waiting for Dev</text><text x="1070" y="399" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Name · Symbol · Ready</text><text x="66" y="556" fill="#76d6cb" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">03 · A guided first climb</text><rect x="70" y="583" width="65" height="65" rx="9" fill="#f4eddc" stroke="none"/><circle cx="102.5" cy="615.5" r="3.575" fill="#101e29"/><rect x="153" y="583" width="65" height="65" rx="9" fill="#f4eddc" stroke="none"/><circle cx="169.9" cy="599.9" r="3.575" fill="#101e29"/><circle cx="201.1" cy="631.1" r="3.575" fill="#101e29"/><rect x="236" y="583" width="65" height="65" rx="9" fill="#f4eddc" stroke="none"/><circle cx="252.9" cy="599.9" r="3.575" fill="#101e29"/><circle cx="252.9" cy="631.1" r="3.575" fill="#101e29"/><circle cx="284.1" cy="599.9" r="3.575" fill="#101e29"/><circle cx="284.1" cy="631.1" r="3.575" fill="#101e29"/><circle cx="268.5" cy="615.5" r="3.575" fill="#101e29"/><rect x="319" y="583" width="65" height="65" rx="9" fill="#f4eddc" stroke="none"/><circle cx="335.9" cy="599.9" r="3.575" fill="#101e29"/><circle cx="335.9" cy="615.5" r="3.575" fill="#101e29"/><circle cx="335.9" cy="631.1" r="3.575" fill="#101e29"/><circle cx="367.1" cy="599.9" r="3.575" fill="#101e29"/><circle cx="367.1" cy="615.5" r="3.575" fill="#101e29"/><circle cx="367.1" cy="631.1" r="3.575" fill="#101e29"/><text x="66" y="698" fill="#f4eddc" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Pair 1+6 and 2+5.</text><text x="66" y="739" fill="#f4eddc" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Both make 7. One runner climbs two spaces.</text><text x="66" y="773" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Now stop to save it, or roll and risk it.</text><rect x="66" y="813" width="285" height="52" rx="12" fill="#76d6cb" stroke="#76d6cb"/><text x="208.5" y="845.0" fill="#101e29" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Try moving 7 twice</text><text x="367" y="845" fill="#76d6cb" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Skip lesson  ↗</text><text x="754" y="556" fill="#76d6cb" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">04 · The third saved summit</text><text x="754" y="619" fill="#e9bd72" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="start">Ari wins!</text><text x="754" y="663" fill="#f4eddc" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Claimed columns 4, 7 and 10</text><text x="754" y="705" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Ari 3    Bea 2    Cal 1    Dev 0</text><rect x="754" y="751" width="284" height="52" rx="12" fill="#76d6cb" stroke="#76d6cb"/><text x="896.0" y="783.0" fill="#101e29" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Play again</text><rect x="1054" y="751" width="316" height="52" rx="12" fill="#192d39" stroke="#42606a"/><text x="1212.0" y="783.0" fill="#f4eddc" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Review final board</text><text x="754" y="858" fill="#b4c6c9" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Rematch keeps names and seats; everyone readies.</text></svg>